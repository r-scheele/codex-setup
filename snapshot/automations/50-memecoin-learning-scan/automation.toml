prompt = "Use $memecoin-onchain-analysis to run a rapid Solana memecoin scan every 15 minutes for wallet TyAMZyASjk9nPQ5Q5fnrDnd5FccDLbeGwZkdt5ocZ1u. Research only. Never connect the wallet, request keys, sign, send funds, or execute a trade. The user executes trades manually.\n\nStart by reading the wallet's current SOL and token balances. If it holds a token, prioritize its exit risk before finding new coins.\n\nDISCOVERY: Search multiple live sources, not one ranking: DexScreener new pairs and boosts, GeckoTerminal new and trending pools, Rug.Tools early signals, and current X activity. Look for exact Solana contracts with current market cap below $100,000. Track pools from roughly 5 minutes to 72 hours old, including new launches, post-graduation pullbacks, and credible revivals. Do not treat paid boosts or scanner rankings as proof.\n\nFAST TRIAGE: Ignore dead or collapsing pools, missing sell activity, liquidity below $8,000, obvious dust-bot volume, extreme one-way trading, and coins already above $100,000. An early lead should normally have rising real buyers, two-way trading, improving liquidity, and a live narrative, but it is not buyable yet.\n\nHARD SAFETY GATES BEFORE A SPECULATIVE SETUP: Confirm the exact contract and canonical pool. Verify mint and freeze authorities are null, there is no active transfer-fee authority, permanent delegate, pause, blacklist, honeypot, or other dangerous Token-2022 control. Require a successful live Jupiter buy quote and reverse sell quote for 0.02 SOL with reasonable price impact. Verify meaningful liquidity is burned or securely locked and is preferably at least $12,000. Check creator history and holdings where available. Excluding pools and burn addresses, prefer largest holder below 5%, top ten below 20%, and linked insider, bundle, or launch clusters below 10%. Missing holder or cluster evidence means Watch, never Speculative setup. Reject wash trading, coordinated fresh-wallet supply, fake volume, or a creator with rug history. A critical failure ends the positive thesis immediately.\n\nNARRATIVE CHECK: Use the exact contract or official pool links to identify the real X account. Check whether the narrative is current, independently discussed, and gaining participation. Separate genuine engagement from paid boosts, copied posts, tiny closed communities, and bot replies. X activity cannot override a failed onchain gate.\n\nPRICE STRUCTURE: Do not chase a vertical move. Prefer a pullback that holds, a higher low, a reclaim with renewed real volume, or a quiet revival with growing holders. Treat gains above roughly 100% in one hour, rapidly falling liquidity, or a sharp volume collapse as Watch or Avoid until a stable base forms.\n\nALERT LEVELS:\n1. EARLY LEAD: Notify promptly when a sub-$100K coin passes the fast triage and hard contract, liquidity, and sellability gates but still needs distribution, persistence, or narrative confirmation. Clearly say DO NOT BUY YET and state what confirmation is missing.\n2. SPECULATIVE SETUP: Notify only when all critical gates pass and multiple independent signals align. Give the observation time, exact contract, pool, age, market cap, liquidity, holder and cluster figures, buy and reverse-sell quote impact, volume quality, X evidence, missing evidence, precise entry confirmation, and invalidation.\n3. EXIT ALERT: Notify immediately if a held token loses its sell route, liquidity falls materially, dangerous control appears, a major holder or linked cluster distributes, the narrative breaks, or price invalidation is reached.\n\nRISK: Maximum proposed first entry is 0.01 SOL for a very early confirmed setup and 0.02 SOL after confirmation. Never propose more than two open positions or more than 0.04 SOL total. Never recommend leverage, averaging down, or martingale. For held winners, report a conditional plan that prioritizes recovering the original stake around 2x and then scaling out, instead of assuming 20x. A 20x outcome is never guaranteed.\n\nLEARNING LOOP: Compare previously alerted leads with current price, liquidity, holder distribution, and peak drawdown when data is available. Use failures to make later alerts stricter, but never loosen a hard safety gate. Keep a short record in the task of why each lead passed, failed, or became invalid.\n\nStay quiet when there is no new actionable lead, no held position needs action, and watched risks have not materially changed. Notify only for a new EARLY LEAD, SPECULATIVE SETUP, EXIT ALERT, required user action, or a failed scan."
